## Config version. DO NOT CHANGE.
__version__ = "1.0.0"

## Generate raw and gym-style wrappers.
use_raw = true
use_gym = true
use_rng = true

## Start with a single environment for interface validation.
use_vec = false
vec_parallel = false

[gym]
    ## Root-level Simulink port names.
    action_key = "Action"
    observation_key = "State"
    reward_key = "Reward"
    done_key = "Done"

    ## There are no additional root outports to return in info.
    info = false
    type_coercion = true

    ## Base reward is 10 or -1; an out-of-range state adds -100.
    reward_range = [-101.0, 10.0]

    [gym.action_space]
        type = "Box"
        ## The MATLAB rlNumericSpec([1 1]) has no finite limits.
        ## Set action_scale=false in GOPS, or replace these values with
        ## verified physical flow-rate limits before enabling scaling.
        low = "-inf"
        high = "inf"
        shape = [1]
        dtype = "float64"

    [gym.observation_space]
        type = "Box"
        ## State order: integral error, error, water level.
        low = ["-inf", "-inf", 0.0]
        high = ["inf", "inf", "inf"]
        shape = [3]
        dtype = "float64"

[reset]
    ## Take one step after initialization to obtain the first observation.
    first_step = true

[parameter]

## Prerequisite: define h_goal and h_initial in the model workspace as
## Simulink.Parameter objects and enable their Argument property.
## This reproduces the mlx resetFcn: N(10, 3^2), truncated to (0, 20).
[parameter.h_goal]
    type = "custom"
    code = """
std::normal_distribution<double> water_level_dist{10.0, 3.0};

do {
    params.h_goal = water_level_dist(rng);
} while (params.h_goal <= 0.0 || params.h_goal >= 20.0);

do {
    params.h_initial = water_level_dist(rng);
} while (params.h_initial <= 0.0 || params.h_initial >= 20.0);
"""
